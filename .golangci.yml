version: "2"
run:
  modules-download-mode: readonly
  tests: true
  allow-parallel-runners: false
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - govet
    - ineffassign
    - nilerr
    - nilnil
    - noctx
    - prealloc
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        no-cgo-sqlite:
          list-mode: lax
          deny:
            - pkg: github.com/mattn/go-sqlite3
              desc: 'Forbidden: CGO SQLite. Use ''modernc.org/sqlite'' (pure-Go) instead. Reason: CGO requires a C compiler, uses 5-10x RAM under -race, and causes OOM kills in CI. See .golangci.yml for the policy.'
            - pkg: github.com/gwenn/gosqlite
              desc: 'Forbidden: CGO SQLite. Use ''modernc.org/sqlite'' (pure-Go) instead.'
            - pkg: github.com/mxk/go-sqlite
              desc: 'Forbidden: CGO SQLite. Use ''modernc.org/sqlite'' (pure-Go) instead.'
            - pkg: github.com/jmoiron/sqlx
              desc: Avoid sqlx with CGO SQLite drivers. Use database/sql + modernc.org/sqlite.
    gosec:
      excludes:
        - G101
        - G104
        - G115
        - G204
        - G304
        - G305
        - G306
        - G401
        - G501
        - G505
        - G703
        - G704
    govet:
      disable:
        - shadow
        - fieldalignment
      enable-all: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - noctx
          - nilerr
          - staticcheck
          - unused
        path: (pkg/|app\.go)
      - linters:
          - gosec
          - noctx
          - nilnil
        path: _test\.go
      - linters:
          - gosec
        text: 'G404: Use of weak random number generator'
      - linters:
          - errorlint
        text: type assertion on error will fail on wrapped errors
      - linters:
          - typecheck
        text: 'could not (load export data|import)'
    paths:
      - vendor
      - node_modules
      - \.venv
      - dist
      - build
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
  new: false
  fix: false
severity:
  default: error
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/snowdreamtech/unigodesktop)
    gofumpt:
      extra:
        group-params: true
  exclusions:
    generated: lax
    paths:
      - vendor
      - node_modules
      - \.venv
      - dist
      - build
      - third_party$
      - builtin$
      - examples$
      - .*\.pb\.go$
