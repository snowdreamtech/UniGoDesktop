---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
project_name: unigodesktop

report_sizes: true

gomod:
  proxy: true

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

git:
  ignore_tags:
    - nightly
    - "*-nightly"

before:
  hooks:
    - go mod tidy
    # Generate shell completion scripts dynamically before building packages
    # NOTE: Uses -tags nogui to compile CLI-only (no Wails/CGO/frontend deps)
    - go run -tags nogui . completion -d ./completions --all
    # Generate manpages
    - go run -tags nogui . generate manpage -d ./manpages

builds:
  - id: unigodesktop-cli
    binary: unigodesktop
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -tags=nogui
    ldflags:
      - -s -w
      - -X 'github.com/snowdreamtech/unigodesktop/internal/env.ProjectName=unigodesktop'
      - -X 'github.com/snowdreamtech/unigodesktop/internal/env.Author=Snowdream Tech <snowdreamtech@qq.com>'
      - -X github.com/snowdreamtech/unigodesktop/internal/env.BuildTime={{.Date}}
      - -X github.com/snowdreamtech/unigodesktop/internal/env.CommitHash={{.ShortCommit}}
      - -X github.com/snowdreamtech/unigodesktop/internal/env.CommitHashFull={{.FullCommit}}
      - -X github.com/snowdreamtech/unigodesktop/internal/env.GitTag={{.Tag}}
      - -X 'github.com/snowdreamtech/unigodesktop/internal/env.COPYRIGHT=Copyright (c) 2026-present SnowdreamTech Inc.'
      - -X 'github.com/snowdreamtech/unigodesktop/internal/env.LICENSE=MIT <https://github.com/snowdreamtech/unigodesktop/blob/main/LICENSE>'
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - loong64
      - ppc64le
      - riscv64
      - s390x
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: unigodesktop-cli
    formats: [tar.gz]
    # This name template makes the OS and Arch compatible with uname and includes the version.
    name_template: >-
      {{- .ProjectName }}-cli_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
    # Wraps the files inside a top-level directory within the archive to prevent tarbombing (Best Practice)
    wrap_in_directory: true
    builds_info:
      group: root
      owner: root
      mtime: "{{ .CommitDate }}"
    # Use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    # Include all relevant standard documentation arrays using Globs
    files:
      - src: "LICENSE*"
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: "README*"
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: "CHANGELOG*"
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: "completions/*"
        dst: "completions"
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: "manpages/*"
        dst: "manpages"
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"

snapshot:
  version_template: SNAPSHOT-{{ .Commit }}

checksum:
  name_template: "checksums.txt"

release:
  name_template: "{{ .Tag }}"
  prerelease: auto
  github:
    owner: snowdreamtech
    name: unigodesktop
  # GUI installers/packages are produced by the dedicated Wails workflow on
  # native OS runners and uploaded separately to this GitHub Release.
  header: |
    **UniGoDesktop** is a modern, high-performance cross-platform desktop application built with Go, Wails, and Vue 3.
  footer: |
    **Full Changelog**: https://github.com/snowdreamtech/unigodesktop/compare/{{ .PreviousTag }}...{{ .Tag }}

    ## 🤝 Contributing

    Contributions are welcome! Please read our [Contributing Guide](https://github.com/snowdreamtech/unigodesktop/blob/main/CONTRIBUTING.md) first.

source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Version }}-source"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "(?i)^test"
      - "(?i)^ci"
      - "(?i)^build"
      - "(?i)^style"
      - "(?i)^revert"
      - "(?i)^chore"
      - "(?i)^deps"
      - "^Merge pull request"
      - "^Merge remote-tracking branch"
      - "^Merge branch"
      - "merge conflict"
      - "^WIP"
      - "^\\[skip ci\\]"
      - "^Bump version"
  groups:
    - title: "🚀 Features"
      regexp: "^.*(?i)feat[(\\w)]*:+.*$"
      order: 100
    - title: "🐛 Bug Fixes"
      regexp: "^.*(?i)fix[(\\w)]*:+.*$"
      order: 200
    - title: "⚡️ Performance Improvements"
      regexp: "^.*(?i)perf[(\\w)]*:+.*$"
      order: 300
    - title: "🛠 Refactoring"
      regexp: "^.*(?i)refactor[(\\w)]*:+.*$"
      order: 400
    - title: "🛡️ Security Updates"
      regexp: "^.*(?i)(sec|security)[(\\w)]*:+.*$"
      order: 600
    - title: "📖 Documentation"
      regexp: "^.*(?i)docs[(\\w)]*:+.*$"
      order: 700
    - title: "♻️ Miscellaneous Chores"
      order: 9999

nfpms:
  - id: default
    file_name_template: "{{ .ProjectName }}-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://github.com/snowdreamtech/unigodesktop
    maintainer: "Snowdream Tech <snowdreamtech@qq.com>"
    description: |-
      UniGoDesktop is a modern cross-platform desktop application built with Go, Wails, and Vue 3.
    license: MIT
    vendor: SnowdreamTech
    bindir: /usr/bin
    section: utils
    mtime: "{{ .CommitDate }}"
    formats:
      - apk
      - deb
      - rpm
      - archlinux
    dependencies:
      - git
    contents:
      - src: ./completions/unigodesktop.bash
        dst: /usr/share/bash-completion/completions/unigodesktop
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: ./completions/unigodesktop.zsh
        dst: /usr/share/zsh/vendor-completions/_unigodesktop
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: ./completions/unigodesktop.fish
        dst: /usr/share/fish/vendor_completions.d/unigodesktop.fish
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: ./manpages/*
        dst: /usr/share/man/man1/
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: LICENSE
        dst: /usr/share/doc/unigodesktop/copyright
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package
    suggests:
      - golang
      - rustup
      - zig
      - deno
      - bun

snapcrafts:
  - name_template: "{{ .ProjectName }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    summary: Modern cross-platform desktop application built with Go, Wails, and Vue 3
    description: |
      UniGoDesktop is a modern, extensible cross-platform desktop application built with Go, Wails, and Vue 3.
    grade: stable
    confinement: classic
    publish: false
    disable: "{{ if .IsNightly }}true{{ end }}"

universal_binaries:
  - replace: false

sboms:
  # Generate SBOMs for all release artifacts: archives (tar.gz/zip) and Linux packages (deb/rpm/apk/archlinux)
  - id: archive
    artifacts: archive
  - id: package
    artifacts: package

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    output: '{{ not (isEnvSet "CI") }}'
    artifacts: checksum
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes # Enables keyless signing via OIDC token
