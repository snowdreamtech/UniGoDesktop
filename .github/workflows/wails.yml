---
name: "🪟 Wails GUI Packaging"

"on":
  # Run only after the primary CLI release is successfully published.
  # This keeps GUI packaging in the same release chain while preserving the
  # native Wails bundle generation step as a second-stage artifact job.
  workflow_run:
    workflows: ["📦 GoReleaser"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to attach GUI assets to"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  gui:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: "Build and attach native GUI artifacts"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin/universal
            asset_glob: "build/bin/*.dmg"
          - os: windows-latest
            target: windows/amd64
            asset_glob: "build/bin/*.exe"
          - os: ubuntu-latest
            target: linux/amd64
            asset_glob: "build/bin/*.tar.gz"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: wails-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      UNIRTM_LOCKED: 1
      GH_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(git tag --points-at "$HEAD_SHA" | head -n 1)"
          fi
          if [ -z "$TAG" ]; then
            echo "No release tag points at ${HEAD_SHA}" >&2
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Release tag: ${TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2d0f64f794a2daf5be0b89ae6eb40b9 # v4.3.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c4f3b0d9679 # v5.2.0
        with:
          go-version-file: go.mod

      - name: Setup UniRTM
        uses: snowdreamtech/setup-unirtm@663cc55933eafea30cd63f43e837cecd4a587f45 # v0.7.0
        with:
          unirtm-version: "0.31.1"
          install: true
          trust: true
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend
          npm ci

      - name: Build frontend assets
        shell: bash
        run: |
          cd frontend
          npm run build

      - name: Prepare UniGoDesktop App Icon
        shell: bash
        run: node scripts/prepare-app-icon.mjs

      - name: Build Wails native bundle
        shell: bash
        env:
          TAG: ${{ env.TAG }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          TAG="${TAG:-$(git describe --tags --abbrev=0 2>/dev/null || echo dev)}"
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          COMMIT_FULL="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          MODULE_PATH="$(go list -m -f '{{.Path}}')"
          PKG="${MODULE_PATH}/internal/env"
          PROJECT_NAME="${MODULE_PATH##*/}"
          mkdir -p build/bin
          unirtm exec -- wails build \
            -clean \
            -platform "${TARGET}" \
            -ldflags "-s -w -X '${PKG}.GitTag=${TAG}' -X '${PKG}.CommitHash=${COMMIT}' -X '${PKG}.CommitHashFull=${COMMIT_FULL}' -X '${PKG}.BuildTime=${DATE}' -X '${PKG}.ProjectName=${PROJECT_NAME}'"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            APP_PATH="$(find build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
            if [ -z "${APP_PATH}" ]; then
              echo "Wails build produced no macOS app bundle" >&2
              exit 1
            fi
            EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP_PATH}/Contents/Info.plist")"
            APP_BINARY="${APP_PATH}/Contents/MacOS/${EXECUTABLE}"
            if [ ! -s "${APP_BINARY}" ] || [ ! -x "${APP_BINARY}" ]; then
              echo "Wails build completed without a runnable macOS binary: ${APP_BINARY}" >&2
              exit 1
            fi
            file "${APP_BINARY}"
          fi

      - name: Codesign macOS App Bundle
        if: runner.os == 'macOS' && secrets.APPLE_CERTIFICATE != ''
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASS: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "${APP_PATH}" ]; then
            echo "App bundle not found in build/bin" >&2
            exit 1
          fi
          echo "Signing macOS App Bundle..."
          codesign --force --deep --options runtime --sign "${APPLE_IDENTITY}" "${APP_PATH}"

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "${APP_PATH}" ]; then
            echo "App bundle not found in build/bin" >&2
            exit 1
          fi
          APP_NAME="$(basename "${APP_PATH}")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP_PATH}/Contents/Info.plist")"
          APP_BINARY="${APP_PATH}/Contents/MacOS/${EXECUTABLE}"
          if [ ! -s "$APP_BINARY" ] || [ ! -x "$APP_BINARY" ]; then
            echo "App bundle has no runnable executable at $APP_BINARY" >&2
            exit 1
          fi
          mkdir -p build/bin/dmg-src
          cp -R "$APP_PATH" "build/bin/dmg-src/${APP_NAME}"
          hdiutil create -volname "${APP_NAME%.app}" -srcfolder build/bin/dmg-src -ov -format UDZO "build/bin/${APP_NAME%.app}.dmg"

      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ env.TAG }}"
          $commit = (git rev-parse HEAD).Trim()
          $date = (Get-Date).ToUniversalTime().ToString("o")
          $pkg = "github.com/snowdreamtech/unigodesktop/internal/env"
          $ldflags = "-s -w -X '$pkg.GitTag=$tag' -X '$pkg.CommitHash=$($commit.Substring(0,7))' -X '$pkg.CommitHashFull=$commit' -X '$pkg.BuildTime=$date' -X '$pkg.ProjectName=unigodesktop'"
          unirtm exec -- wails build -platform windows/amd64 -nsis -ldflags "$ldflags"

      - name: Create Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          APP_BIN="build/bin/unigodesktop"
          if [ ! -f "$APP_BIN" ]; then
            echo "Linux binary not found at $APP_BIN" >&2
            exit 1
          fi
          tar -czf build/bin/unigodesktop-gui_linux_amd64.tar.gz -C build/bin unigodesktop

      - name: Secure GUI artifacts
        env:
          ASSET_GLOB: ${{ matrix.asset_glob }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="$(compgen -G "${ASSET_GLOB}" | head -n 1)"
          if [ -z "${ASSET}" ]; then
            echo "No release asset matched ${ASSET_GLOB}" >&2
            exit 1
          fi
          CHECKSUM_FILE="build/bin/unigodesktop-gui-${RUNNER_OS}.sha256"
          sha256sum "${ASSET}" > "${CHECKSUM_FILE}"
          sha256sum --check "${CHECKSUM_FILE}"
          syft "file:${ASSET}" -o "spdx-json=${ASSET}.sbom.spdx.json"
          cosign sign-blob --yes \
            --bundle "${ASSET}.sigstore.json" \
            "${ASSET}"
          cosign verify-blob \
            --certificate-identity "${WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --bundle "${ASSET}.sigstore.json" \
            "${ASSET}"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"
          echo "CHECKSUM_FILE=${CHECKSUM_FILE}" >> "$GITHUB_ENV"

      - name: Attest GUI artifact provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: build/bin/unigodesktop-gui-${{ runner.os }}.sha256

      - name: Wait for release to exist
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
              echo "Release ${TAG} is ready"
              exit 0
            fi
            echo "Waiting for release ${TAG} to appear (${i}/30)..."
            sleep 5
          done
          echo "Release ${TAG} was not found after waiting" >&2
          exit 1

      - name: Upload GUI artifacts to GitHub Release
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "${ASSET}"
            "${CHECKSUM_FILE}"
            "${ASSET}.sbom.spdx.json"
            "${ASSET}.sigstore.json"
          )
          gh release upload "${TAG}" \
            --repo "${REPOSITORY}" \
            --clobber \
            "${assets[@]}"

  rollback:
    if: ${{ always() && needs.gui.result == 'failure' }}
    needs: [gui]
    name: "Rollback partial GUI release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Delete partial release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$(git tag --points-at "$HEAD_SHA" | head -n 1)}"
          if [ -z "$TAG" ]; then
            echo "No release tag points at ${HEAD_SHA}; nothing to roll back"
            exit 0
          fi
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$REPOSITORY" --yes --cleanup-tag
          else
            echo "Release ${TAG} does not exist; nothing to roll back"
          fi
