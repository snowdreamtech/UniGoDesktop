<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniGoDesktop - Golang Desktop Template</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      text-align: left;
      margin-top: 1.5rem;
    }

    .info-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      padding: 1rem;
      border-radius: 8px;
    }

    .info-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .info-value {
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 0.25rem;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🚀</div>
    <h1>UniGoDesktop</h1>
    <p class="subtitle">High-performance Golang Desktop Application Template</p>
    
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="app-status">Running</span>
    </div>

    <div class="info-grid">
      <div class="info-card">
        <div class="info-label">Application</div>
        <div class="info-value" id="app-name">UniGoDesktop</div>
      </div>
      <div class="info-card">
        <div class="info-label">Engine</div>
        <div class="info-value">Go Native Desktop</div>
      </div>
      <div class="info-card">
        <div class="info-label">State</div>
        <div class="info-value" id="app-state">Active</div>
      </div>
      <div class="info-card">
        <div class="info-label">Uptime</div>
        <div class="info-value" id="app-uptime">0s</div>
      </div>
    </div>
  </div>

  <script>
    async function fetchStatus() {
      try {
        const res = await fetch('/api/v1/status');
        if (res.ok) {
          const data = await res.json();
          document.getElementById('app-state').textContent = data.state || 'running';
          document.getElementById('app-uptime').textContent = data.uptime || '0s';
        }
      } catch (err) {
        console.error('Failed to fetch status:', err);
      }
    }
    setInterval(fetchStatus, 3000);
    fetchStatus();
  </script>
</body>
</html>
